[workspace]
resolver = "3"

members = [
    "forma-core",
    "adaptors/api-gateway",
    "services/auth-service",
    "forma-proc-macro"
]

[workspace.dependencies]
rustls = "0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
async-trait = "0.1.89"
sha2 = "0.11.0"
strum = { version = "0.28", features = ["derive"] }
chrono = "0.4.45"
mongodb = { version = "3.8.0", features=["bson-3"] }
futures = "0.3.34"
redis = { version = "1.3.0", features = ["bb8", "tokio-comp", "connection-manager", "cluster-async"] }
axum = { version = "0.8.9", features = ["macros", "http2", ] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tokio = { version = "1.52.3", features = ["full"] }

forma-core = { path = "./forma-core" }
forma-proc-macro = { path = "./forma-proc-macro" }

[profile.release]
debug = false
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
